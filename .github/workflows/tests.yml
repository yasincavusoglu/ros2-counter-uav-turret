name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The node logic is a pure-Python core split from the ROS 2 wrappers,
      # so the whole test suite runs without a ROS installation.
      - name: Install dependencies
        run: pip install numpy opencv-python-headless pytest

      - name: Run test suite
        run: pytest test/ -v
